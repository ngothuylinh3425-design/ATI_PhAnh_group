services:
  mysql:
    image: mariadb:10.11
    container_name: smart_doc_mysql
    restart: unless-stopped   # <-- Tự động bật lại khi khởi động Docker/Máy tính
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smart_doc_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:latest
    container_name: smart_doc_mongo
    restart: unless-stopped   # <-- Tự động bật lại khi khởi động Docker/Máy tính
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data: